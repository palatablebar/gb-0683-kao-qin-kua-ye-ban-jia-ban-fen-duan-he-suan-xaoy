{% extends "base.html" %}{% block content %}<div class="sheet-layout"><section class="panel sheet"><header><h2>打卡原件</h2><span>{{data.encoding}}</span></header><div class="scroll"><table class="ledger"><thead><tr class="letters"><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr><tr><th>#</th><th>员工</th><th>班次日</th><th>方向</th><th>打卡时刻</th><th>时薪 CNY</th></tr></thead><tbody>{% for r in data.rows %}<tr><td class="rownum">{{r._line}}</td><td tabindex="0">{{r.employee}}</td><td tabindex="0">{{r.shift_day}}</td><td>{{r.punch}}</td><td>{{r.at}}</td><td class="num">{{r.hourly_rate}}</td></tr>{% endfor %}</tbody></table></div></section><section class="panel side"><header><h2>打卡数据</h2></header><form id="clock-file"><label>样例<select name="sample"><option>dirty.csv</option><option>clean.csv</option><option>legacy.csv</option></select></label><label>CSV<textarea name="csv" rows="5" placeholder="粘贴打卡记录"></textarea></label><button>提交</button></form></section>{% include "exceptions.html" %}</div>{% endblock %}
